[project]
name = "quicken-exporter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "olefile==0.47",
]

[dependency-groups]
dev = [
    "ruff==0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["D"]
