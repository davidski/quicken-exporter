[project]
name = "quicken-exporter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "olefile==0.47",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdf_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["D"]
"tests/**/*.py" = ["D"]
